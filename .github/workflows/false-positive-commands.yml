name: Handle false-positive slash commands

on:
  issue_comment:
    types: [created]

jobs:
  process:
    # Only act on false-positive reports in the feedback repo
    if: |
      (startsWith(github.event.issue.title, '[False Positive]') ||
       startsWith(github.event.issue.title, '[False Positive')) &&
      (contains(github.event.issue.labels.*.name, 'false-positive') ||
       contains(github.event.issue.labels.*.name, 'data-classification'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Process slash command
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const comment = context.payload.comment;

            // Only process commands from an explicitly allow-listed set of users.
            const allowedUsers = (process.env.ALLOWED_USERS || '')
              .split(',')
              .map((s) => s.trim().toLowerCase())
              .filter(Boolean);

            if (allowedUsers.length === 0) {
              console.log('ALLOWED_USERS is not configured; no commands will be executed');
              return;
            }

            const username = comment.user.login.toLowerCase();
            if (!allowedUsers.includes(username)) {
              console.log(`Ignoring comment from ${comment.user.login} (not in ALLOWED_USERS)`);
              return;
            }

            // Look for a command like /allowlist, /false_positive, /remove, /dry-run
            const cmdMatch = comment.body.match(/(?:^|\s)\/(allowlist|false_positive|remove|dry-run)(?:\s|$)/i);
            if (!cmdMatch) {
              console.log('No recognised slash command found');
              return;
            }
            const cmd = cmdMatch[1].toLowerCase();
            const dryRun = cmd === 'dry-run';

            // Always pick the action that would be performed, even in dry-run mode,
            // so the summary is accurate. If the command is /dry-run, we default to
            // showing what a /false_positive change would look like.
            let action = cmd;
            if (dryRun) {
              // Try to infer intended action from the rest of the comment.
              const intentMatch = comment.body.match(/(?:^|\s)\/(allowlist|false_positive|remove)(?:\s|$)/ig);
              if (intentMatch) {
                action = intentMatch[intentMatch.length - 1].toLowerCase().replace(/\//g, '').trim();
              } else {
                action = 'false_positive';
              }
            }

            if (!['allowlist', 'false_positive', 'remove'].includes(action)) {
              console.log(`Unknown or unsupported action: ${action}`);
              return;
            }

            // Extract candidate domains from the issue title and body.
            const text = `${issue.title || ''}\n${issue.body || ''}`;
            const candidates = [
              ...text.matchAll(
                /(?:\b|@|\[)([a-z0-9][a-z0-9-]*(?:\.[a-z0-9][a-z0-9-]*)+)(?:\b|\]|\?|!|,|;|:|\.\s|\s|$)/gi
              ),
            ]
              .map((m) => m[1].toLowerCase().trim())
              .filter((d) => {
                if (d.length > 253) return false;
                const labels = d.split('.');
                if (labels.length < 2) return false;
                return labels.every((l) => l.length > 0 && l.length <= 63);
              });

            // Drop common reference domains that sometimes appear in issue bodies.
            const ignored = new Set([
              'github.com',
              'raw.githubusercontent.com',
              'gist.github.com',
              'www.w3.org',
              'example.com',
              'localhost',
            ]);
            const domains = [...new Set(candidates)].filter((d) => !ignored.has(d));

            if (domains.length === 0) {
              console.log('No domains found in issue');
              return;
            }

            const endpoint = 'https://throwaway.cloud';
            const token = process.env.THROWAWAY_TOKEN;
            const issueUrl = issue.html_url;

            const results = [];
            for (const domain of domains) {
              let success = false;
              let summaryAction = '';

              if (dryRun) {
                summaryAction =
                  action === 'remove'
                    ? 'would be removed from disposable list'
                    : `would be added as ${action} override`;
                success = true;
              } else if (action === 'remove') {
                summaryAction = 'removed from disposable list';
                const resp = await fetch(`${endpoint}/api/admin/submit`, {
                  method: 'DELETE',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`,
                  },
                  body: JSON.stringify({ domain }),
                });
                success = resp.ok;
              } else {
                summaryAction = `added as ${action} override`;
                const body = {
                  entries: [
                    {
                      hostname: domain,
                      type: action,
                      issue: issueUrl,
                      tags: ['community'],
                    },
                  ],
                };
                const resp = await fetch(`${endpoint}/api/admin/overrides/bulk`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`,
                  },
                  body: JSON.stringify(body),
                });
                const data = await resp.json().catch(() => ({}));
                success = resp.ok && data.success === true;
              }

              results.push({ domain, action: summaryAction, success });
            }

            const summary = results
              .map((r) => `- ${r.domain}: ${r.success ? '✅' : '❌'} ${r.action}`)
              .join('\n');

            const header = dryRun
              ? `Dry-run for \`/${action}\` (${domains.length} domain(s))`
              : `Processed \`/${action}\` for ${domains.length} domain(s)`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `${header}\n${summary}`,
            });
        env:
          THROWAWAY_TOKEN: ${{ secrets.THROWAWAY_TOKEN }}
          ALLOWED_USERS: ${{ vars.ALLOWED_USERS }}
